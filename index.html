<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Midnight Haunt: Reaction Game</title>
  <style>
    :root {
      --black: #07070b;
      --deep-black: #030305;
      --purple: #7b2cbf;
      --purple-bright: #c77dff;
      --purple-dark: #3c096c;
      --text: #f5efff;
      --muted: #bca8cb;
      --danger: #ff3d71;
      --success: #d7a9ff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      overflow: hidden;
      color: var(--text);
      font-family: "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(circle at 50% 20%, rgba(123, 44, 191, 0.17), transparent 35%),
        radial-gradient(circle at 10% 95%, rgba(91, 26, 142, 0.16), transparent 38%),
        linear-gradient(145deg, #08070e 0%, var(--black) 45%, #10081a 100%);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      pointer-events: none;
      inset: -20%;
      z-index: 0;
    }

    body::before {
      opacity: 0.22;
      background-image:
        radial-gradient(rgba(255,255,255,0.35) 0.55px, transparent 0.7px),
        radial-gradient(rgba(190,120,255,0.22) 0.55px, transparent 0.7px);
      background-position: 0 0, 8px 12px;
      background-size: 18px 18px, 23px 23px;
      mix-blend-mode: screen;
      animation: grain 0.22s steps(2) infinite;
    }

    body::after {
      background:
        radial-gradient(ellipse at 20% 50%, rgba(151, 65, 255, 0.14), transparent 28%),
        radial-gradient(ellipse at 76% 27%, rgba(219, 176, 255, 0.11), transparent 24%),
        radial-gradient(ellipse at 55% 85%, rgba(92, 18, 143, 0.17), transparent 31%);
      filter: blur(35px);
      animation: fog 12s ease-in-out infinite alternate;
    }

    @keyframes grain {
      0% { transform: translate(0, 0); }
      25% { transform: translate(1%, -1%); }
      50% { transform: translate(-1%, 1%); }
      75% { transform: translate(1%, 1%); }
      100% { transform: translate(-1%, -1%); }
    }

    @keyframes fog {
      from { transform: translate3d(-3%, -2%, 0) scale(1); }
      to { transform: translate3d(4%, 3%, 0) scale(1.12); }
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(1100px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: clamp(18px, 4vw, 42px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .screen {
      width: 100%;
      animation: reveal 0.45s ease both;
    }

    .hidden {
      display: none !important;
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .intro-card,
    .result-card {
      width: min(650px, 100%);
      margin: 0 auto;
      padding: clamp(34px, 7vw, 68px) clamp(24px, 6vw, 62px);
      text-align: center;
      border: 1px solid rgba(211, 151, 255, 0.25);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(22, 12, 33, 0.89), rgba(7, 7, 11, 0.86));
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03) inset,
        0 0 34px rgba(123, 44, 191, 0.2),
        0 30px 80px rgba(0,0,0,0.58);
      backdrop-filter: blur(12px);
    }

    .eyebrow {
      margin: 0 0 13px;
      color: var(--purple-bright);
      font-size: 0.73rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h1,
    h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 700;
      letter-spacing: -0.045em;
      text-shadow: 0 0 22px rgba(194, 120, 255, 0.55);
    }

    h1 {
      font-size: clamp(2.7rem, 8vw, 5.25rem);
      line-height: 0.94;
    }

    h1 span {
      display: block;
      color: #d9aeff;
      font-size: 0.53em;
      letter-spacing: 0.16em;
      margin: 13px 0 0;
      text-transform: uppercase;
    }

    .description {
      max-width: 430px;
      margin: 29px auto 34px;
      color: var(--muted);
      font-size: clamp(0.95rem, 2vw, 1.06rem);
      line-height: 1.8;
      word-break: keep-all;
    }

    .rule-line {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 0 0 34px;
    }

    .rule-tag {
      padding: 8px 12px;
      border: 1px solid rgba(199, 125, 255, 0.2);
      border-radius: 999px;
      color: #d9c6e8;
      background: rgba(123, 44, 191, 0.09);
      font-size: 0.8rem;
    }

    button {
      border: 0;
      font: inherit;
      cursor: pointer;
    }

    .main-button {
      position: relative;
      overflow: hidden;
      min-width: 200px;
      padding: 16px 27px;
      border: 1px solid rgba(235, 202, 255, 0.72);
      border-radius: 4px;
      color: #fff;
      background: linear-gradient(135deg, #4b127b, #8d36d2);
      box-shadow: 0 0 22px rgba(157, 70, 231, 0.4), 0 12px 28px rgba(0,0,0,0.38);
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
    }

    .main-button::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -70%;
      width: 45%;
      height: 200%;
      background: rgba(255,255,255,0.3);
      transform: rotate(22deg);
      transition: left 0.45s ease;
    }

    .main-button:hover {
      transform: translateY(-3px);
      filter: brightness(1.14);
      box-shadow: 0 0 32px rgba(194, 106, 255, 0.65), 0 16px 30px rgba(0,0,0,0.42);
    }

    .main-button:hover::before {
      left: 130%;
    }

    .main-button:active {
      transform: translateY(0) scale(0.98);
    }

    #gameScreen {
      max-width: 1000px;
      margin: auto;
    }

    .hud {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 18px;
      align-items: center;
      margin-bottom: 17px;
    }

    .hud-box {
      padding: 13px 17px;
      border: 1px solid rgba(188, 116, 244, 0.22);
      border-radius: 12px;
      background: rgba(8, 6, 14, 0.72);
      box-shadow: 0 0 20px rgba(103, 30, 157, 0.12) inset;
    }

    .hud-box.score-box {
      text-align: right;
    }

    .hud-label {
      display: block;
      margin-bottom: 3px;
      color: #ae90bd;
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.18em;
    }

    .hud-value {
      color: #fff;
      font-family: Georgia, serif;
      font-size: clamp(1.7rem, 5vw, 2.45rem);
      font-weight: 700;
      line-height: 1;
      text-shadow: 0 0 12px rgba(199,125,255,0.56);
    }

    .hud-title {
      color: #d9b6f6;
      font-family: Georgia, serif;
      font-size: clamp(0.85rem, 2vw, 1.1rem);
      letter-spacing: 0.08em;
      text-align: center;
      text-shadow: 0 0 12px rgba(199,125,255,0.45);
    }

    .game-area {
      position: relative;
      height: min(65vh, 610px);
      min-height: 420px;
      overflow: hidden;
      border: 1px solid rgba(196, 126, 248, 0.28);
      border-radius: 20px;
      background:
        linear-gradient(180deg, rgba(65, 26, 88, 0.12), transparent 35%),
        radial-gradient(ellipse at 50% 120%, rgba(115, 28, 172, 0.3), transparent 60%),
        linear-gradient(135deg, rgba(17, 10, 27, 0.95), rgba(3, 3, 6, 0.96));
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.025) inset,
        0 0 38px rgba(92, 18, 143, 0.2),
        0 25px 60px rgba(0,0,0,0.48);
      user-select: none;
    }

    .game-area::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.5;
      background:
        linear-gradient(90deg, transparent 49.8%, rgba(219, 173, 255, 0.08) 50%, transparent 50.2%),
        linear-gradient(transparent 49.8%, rgba(219, 173, 255, 0.06) 50%, transparent 50.2%);
      background-size: 80px 80px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.58), transparent);
      pointer-events: none;
    }

    .game-area::after {
      content: "THE DARKNESS IS WATCHING";
      position: absolute;
      bottom: 22px;
      left: 0;
      width: 100%;
      color: rgba(214, 170, 255, 0.11);
      font-size: clamp(0.6rem, 1.5vw, 0.75rem);
      font-weight: 800;
      letter-spacing: 0.5em;
      text-align: center;
      pointer-events: none;
    }

    .character {
      position: absolute;
      z-index: 2;
      display: grid;
      place-items: center;
      width: clamp(80px, 15vw, 124px);
      aspect-ratio: 1;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      animation: jumpscare 0.2s cubic-bezier(.12,.86,.24,1.25) both, float 1.15s ease-in-out infinite alternate;
      touch-action: manipulation;
    }

    .character.target {
      cursor: pointer;
    }

    .character .emoji {
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 0 8px rgba(218, 155, 255, 0.7)) drop-shadow(0 11px 8px rgba(0, 0, 0, 0.8));
      font-size: clamp(3.6rem, 8vw, 6.1rem);
      line-height: 1;
      transform: scale(1.05);
    }

    .character::before {
      content: "";
      position: absolute;
      inset: 9%;
      border: 1px solid rgba(227, 178, 255, 0.45);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(177, 70, 255, 0.34), rgba(63, 14, 97, 0.05) 62%, transparent 68%);
      box-shadow: 0 0 24px rgba(176, 65, 255, 0.5);
      animation: pulse 0.72s ease-in-out infinite alternate;
    }

    .character.bat::before {
      border-color: rgba(255, 74, 119, 0.3);
      background: radial-gradient(circle, rgba(134, 18, 59, 0.28), transparent 65%);
      box-shadow: 0 0 18px rgba(223, 39, 95, 0.28);
    }

    .character.bat .emoji {
      filter: grayscale(0.5) brightness(0.88) drop-shadow(0 0 8px rgba(255, 63, 111, 0.42));
    }

    @keyframes jumpscare {
      0% { opacity: 0; transform: scale(0.12) rotate(-10deg); }
      62% { opacity: 1; transform: scale(1.22) rotate(3deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); }
    }

    @keyframes float {
      from { margin-top: -3px; }
      to { margin-top: 5px; }
    }

    @keyframes pulse {
      from { transform: scale(0.94); opacity: 0.58; }
      to { transform: scale(1.08); opacity: 1; }
    }

    .feedback {
      position: absolute;
      z-index: 5;
      transform: translate(-50%, -50%);
      pointer-events: none;
      color: white;
      font-family: Georgia, serif;
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: bold;
      text-shadow: 0 0 12px currentColor;
      animation: feedbackRise 0.7s ease-out forwards;
    }

    .feedback.good { color: #e3b8ff; }
    .feedback.bad { color: #ff5c87; }

    @keyframes feedbackRise {
      0% { opacity: 0; transform: translate(-50%, -40%) scale(0.6); }
      20% { opacity: 1; transform: translate(-50%, -50%) scale(1.14); }
      100% { opacity: 0; transform: translate(-50%, -130%) scale(0.96); }
    }

    .particle {
      position: absolute;
      z-index: 4;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      pointer-events: none;
      background: #e4adff;
      box-shadow: 0 0 12px #d06dff;
      animation: burst 0.6s ease-out forwards;
    }

    @keyframes burst {
      from { opacity: 1; transform: translate(0, 0) scale(1); }
      to { opacity: 0; transform: translate(var(--x), var(--y)) scale(0); }
    }

    .penalty-flash {
      animation: penaltyShake 0.36s linear;
    }

    @keyframes penaltyShake {
      0%, 100% { transform: translateX(0); box-shadow: 0 0 38px rgba(92, 18, 143, 0.2); }
      20% { transform: translateX(-9px); background-color: rgba(135, 8, 57, 0.24); }
      40% { transform: translateX(9px); }
      60% { transform: translateX(-6px); background-color: rgba(104, 26, 145, 0.29); }
      80% { transform: translateX(5px); }
    }

    .countdown-overlay {
      position: absolute;
      z-index: 10;
      inset: 0;
      display: grid;
      place-items: center;
      color: #fff;
      background: rgba(3, 2, 7, 0.63);
      backdrop-filter: blur(3px);
    }

    .countdown-number {
      font-family: Georgia, serif;
      font-size: clamp(5rem, 20vw, 10rem);
      font-weight: bold;
      text-shadow: 0 0 28px #a849eb, 0 0 60px #5b1a8e;
      animation: countPop 0.8s ease both;
    }

    @keyframes countPop {
      from { opacity: 0; transform: scale(1.5); }
      to { opacity: 1; transform: scale(1); }
    }

    h2 {
      font-size: clamp(3.4rem, 11vw, 6.5rem);
      color: #e2b7ff;
      line-height: 0.9;
    }

    .final-score-label {
      margin: 29px 0 7px;
      color: #ab8fbb;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.22em;
    }

    .final-score {
      color: #fff;
      font-family: Georgia, serif;
      font-size: clamp(4.5rem, 15vw, 7rem);
      font-weight: 700;
      line-height: 0.95;
      text-shadow: 0 0 25px rgba(200, 118, 255, 0.68);
    }

    .result-message {
      min-height: 30px;
      margin: 24px auto 34px;
      color: #d7bedf;
      font-size: 1.05rem;
      line-height: 1.7;
      word-break: keep-all;
    }

    @media (max-width: 560px) {
      .app {
        padding: 16px;
      }

      .hud {
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }

      .hud-title {
        display: none;
      }

      .hud-box {
        padding: 12px;
      }

      .game-area {
        height: 68vh;
        min-height: 390px;
        border-radius: 15px;
      }

      .game-area::after {
        bottom: 16px;
        font-size: 0.52rem;
        letter-spacing: 0.32em;
      }

      .character {
        width: clamp(76px, 25vw, 104px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section id="startScreen" class="screen">
      <div class="intro-card">
        <p class="eyebrow">Halloween Reaction Test</p>
        <h1>Midnight Haunt <span>Reaction Game</span></h1>
        <p class="description">
          괴물을 클릭해 점수를 얻으세요.<br />
          박쥐를 클릭하면 감점됩니다.
        </p>

        <div class="rule-line" aria-label="게임 규칙">
          <span class="rule-tag">👻 타깃 +1</span>
          <span class="rule-tag">🦇 박쥐 -2</span>
          <span class="rule-tag">놓친 타깃 -1</span>
        </div>

        <button id="startButton" class="main-button" type="button">START GAME</button>
      </div>
    </section>

    <section id="gameScreen" class="screen hidden">
      <header class="hud">
        <div class="hud-box">
          <span class="hud-label">TIME REMAINING</span>
          <strong id="timeDisplay" class="hud-value">30.0</strong>
        </div>

        <div class="hud-title">MIDNIGHT<br />HAUNT</div>

        <div class="hud-box score-box">
          <span class="hud-label">CURRENT SCORE</span>
          <strong id="scoreDisplay" class="hud-value">0</strong>
        </div>
      </header>

      <div id="gameArea" class="game-area" aria-label="게임 플레이 영역">
        <div id="countdownOverlay" class="countdown-overlay hidden" aria-live="assertive">
          <span id="countdownNumber" class="countdown-number">3</span>
        </div>
      </div>
    </section>

    <section id="resultScreen" class="screen hidden">
      <div class="result-card">
        <p class="eyebrow">The clock has stopped</p>
        <h2>TIME'S UP</h2>
        <p class="final-score-label">FINAL SCORE</p>
        <div id="finalScore" class="final-score">0</div>
        <p id="resultMessage" class="result-message"></p>
        <button id="playAgainButton" class="main-button" type="button">PLAY AGAIN</button>
      </div>
    </section>
  </main>

  <script>
    const startScreen = document.getElementById("startScreen");
    const gameScreen = document.getElementById("gameScreen");
    const resultScreen = document.getElementById("resultScreen");
    const startButton = document.getElementById("startButton");
    const playAgainButton = document.getElementById("playAgainButton");
    const gameArea = document.getElementById("gameArea");
    const scoreDisplay = document.getElementById("scoreDisplay");
    const timeDisplay = document.getElementById("timeDisplay");
    const finalScore = document.getElementById("finalScore");
    const resultMessage = document.getElementById("resultMessage");
    const countdownOverlay = document.getElementById("countdownOverlay");
    const countdownNumber = document.getElementById("countdownNumber");

    const characters = [
      { type: "mummy", emoji: "🧟", label: "미라", target: true },
      { type: "dracula", emoji: "🧛", label: "드라큘라", target: true },
      { type: "ghost", emoji: "👻", label: "처녀귀신", target: true },
      { type: "bat", emoji: "🦇", label: "박쥐", target: false }
    ];

    let score = 0;
    let gameActive = false;
    let currentCharacter = null;
    let gameEndTime = 0;
    let gameTimer = null;
    let spawnTimer = null;
    let removeTimer = null;
    let countdownTimer = null;

    function randomBetween(min, max) {
      return Math.random() * (max - min) + min;
    }

    function updateScore(amount) {
      if (!gameActive) return;
      score += amount;
      scoreDisplay.textContent = score;
    }

    function clearGameTimers() {
      clearInterval(gameTimer);
      clearTimeout(spawnTimer);
      clearTimeout(removeTimer);
      clearInterval(countdownTimer);

      gameTimer = null;
      spawnTimer = null;
      removeTimer = null;
      countdownTimer = null;
    }

    function removeCurrentCharacter() {
      if (currentCharacter) {
        currentCharacter.remove();
        currentCharacter = null;
      }
    }

    function showFeedback(text, x, y, isGood) {
      const feedback = document.createElement("div");
      feedback.className = `feedback ${isGood ? "good" : "bad"}`;
      feedback.textContent = text;
      feedback.style.left = `${x}px`;
      feedback.style.top = `${y}px`;
      gameArea.appendChild(feedback);

      setTimeout(() => feedback.remove(), 750);
    }

    function createParticles(x, y) {
      for (let i = 0; i < 13; i++) {
        const particle = document.createElement("span");
        const angle = (Math.PI * 2 * i) / 13 + Math.random() * 0.35;
        const distance = randomBetween(28, 78);

        particle.className = "particle";
        particle.style.left = `${x}px`;
        particle.style.top = `${y}px`;
        particle.style.setProperty("--x", `${Math.cos(angle) * distance}px`);
        particle.style.setProperty("--y", `${Math.sin(angle) * distance}px`);

        gameArea.appendChild(particle);
        setTimeout(() => particle.remove(), 650);
      }
    }

    function playPenaltyEffect() {
      gameArea.classList.remove("penalty-flash");
      void gameArea.offsetWidth;
      gameArea.classList.add("penalty-flash");
      setTimeout(() => gameArea.classList.remove("penalty-flash"), 400);
    }

    function scheduleNextCharacter() {
      if (!gameActive) return;

      const delay = randomBetween(130, 360);
      spawnTimer = setTimeout(() => {
        if (gameActive) spawnCharacter();
      }, delay);
    }

    function spawnCharacter() {
      if (!gameActive || currentCharacter) return;

      const characterData = characters[Math.floor(Math.random() * characters.length)];
      const character = document.createElement("button");
      const size = Math.min(124, Math.max(80, gameArea.clientWidth * 0.15));
      const padding = 8;
      const maxLeft = Math.max(padding, gameArea.clientWidth - size - padding);
      const maxTop = Math.max(padding, gameArea.clientHeight - size - padding - 24);
      const left = randomBetween(padding, maxLeft);
      const top = randomBetween(padding, maxTop);

      character.type = "button";
      character.className = `character ${characterData.target ? "target" : "bat"}`;
      character.setAttribute("aria-label", characterData.label);
      character.dataset.target = String(characterData.target);
      character.style.left = `${left}px`;
      character.style.top = `${top}px`;
      character.innerHTML = `<span class="emoji" aria-hidden="true">${characterData.emoji}</span>`;

      character.addEventListener("click", (event) => {
        if (!gameActive || currentCharacter !== character) return;

        const rect = gameArea.getBoundingClientRect();
        const clickX = event.clientX ? event.clientX - rect.left : left + size / 2;
        const clickY = event.clientY ? event.clientY - rect.top : top + size / 2;

        clearTimeout(removeTimer);
        currentCharacter = null;
        character.remove();

        if (characterData.target) {
          updateScore(1);
          showFeedback("+1", clickX, clickY, true);
          createParticles(clickX, clickY);
        } else {
          updateScore(-2);
          showFeedback("-2", clickX, clickY, false);
          playPenaltyEffect();
        }

        scheduleNextCharacter();
      });

      gameArea.appendChild(character);
      currentCharacter = character;

      const visibleTime = randomBetween(500, 900);
      removeTimer = setTimeout(() => {
        if (!gameActive || currentCharacter !== character) return;

        currentCharacter = null;
        character.remove();

        if (characterData.target) {
          updateScore(-1);
          showFeedback("-1", left + size / 2, top + size / 2, false);
        }

        scheduleNextCharacter();
      }, visibleTime);
    }

    function runCountdown() {
      let count = 3;
      countdownOverlay.classList.remove("hidden");
      countdownNumber.textContent = count;

      countdownTimer = setInterval(() => {
        count--;

        if (count <= 0) {
          clearInterval(countdownTimer);
          countdownTimer = null;
          countdownOverlay.classList.add("hidden");
          beginActualGame();
          return;
        }

        countdownNumber.textContent = count;
        countdownNumber.style.animation = "none";
        void countdownNumber.offsetWidth;
        countdownNumber.style.animation = "";
      }, 850);
    }

    function beginActualGame() {
      if (!gameActive) return;

      gameEndTime = Date.now() + 30000;
      timeDisplay.textContent = "30.0";
      spawnCharacter();

      gameTimer = setInterval(() => {
        const remaining = Math.max(0, gameEndTime - Date.now());
        timeDisplay.textContent = (remaining / 1000).toFixed(1);

        if (remaining <= 0) {
          endGame();
        }
      }, 50);
    }

    function getResultMessage(finalResult) {
      if (finalResult >= 26) return "당신은 어둠 속의 사냥꾼입니다.";
      if (finalResult >= 17) return "망령들이 당신의 반사신경을 기억할 것입니다.";
      if (finalResult >= 8) return "당신은 자정의 공포를 간신히 길들였습니다.";
      if (finalResult >= 0) return "그림자가 당신보다 한 발 빨랐습니다.";
      return "오늘 밤, 박쥐들이 당신의 이름을 부를 겁니다.";
    }

    function endGame() {
      if (!gameActive) return;

      gameActive = false;
      clearGameTimers();
      removeCurrentCharacter();
      timeDisplay.textContent = "0.0";

      gameArea.querySelectorAll(".feedback, .particle").forEach((element) => element.remove());

      finalScore.textContent = score;
      resultMessage.textContent = getResultMessage(score);

      gameScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");
    }

    function startGame() {
      clearGameTimers();
      removeCurrentCharacter();

      score = 0;
      gameActive = true;
      scoreDisplay.textContent = "0";
      timeDisplay.textContent = "30.0";

      gameArea.querySelectorAll(".feedback, .particle").forEach((element) => element.remove());

      startScreen.classList.add("hidden");
      resultScreen.classList.add("hidden");
      gameScreen.classList.remove("hidden");

      runCountdown();
    }

    startButton.addEventListener("click", startGame);
    playAgainButton.addEventListener("click", startGame);
  </script>
</body>
</html>
